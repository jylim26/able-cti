[general]
static = yes
writeprotect = yes

[from-internal]
; 내선 간 통화 — CTI 추적 대상 아님
exten => _1XXX,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; 에코 테스트
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[from-trunk]
; 대표번호 — 큐 인입
; CTI 추적 계약: 추적할 콜은 dialplan이 명시적으로 마킹한다 (ADR-0003)
; UserEvent에 Linkedid를 직접 실으면 채널 스냅샷 헤더와 중복돼 파싱이 깨진다 — 싣지 않는다
exten => 0212345678,1,Answer()
 same => n,UserEvent(CtiCallStarted,Direction: INBOUND)
 same => n,Queue(queue01,t)
 same => n,Hangup()

; DID 직통 — 내선으로 바로 연결
exten => _1XXX,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

[hold]
; 서버형 보류의 전환 대상. 상담원 채널을 Atxfer로 여기 보내면 고객은 MOH 대기.
; 가드: CTI가 죽어도 최대 300초 후 스스로 끊어 고아 보류를 정리한다
exten => _X.,1,Answer()
 same => n,MusicOnHold(default,300)
 same => n,UserEvent(HoldGuardTimeout)
 same => n,Hangup()
