[general]
static = yes
writeprotect = yes

[from-internal]
; 내선 간 통화 — CTI 추적 대상 아님
exten => _1XXX,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; 에코 테스트
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[from-trunk]
; 대표번호 — 큐 인입
; CTI 추적 계약: 추적할 콜은 dialplan이 명시적으로 마킹한다 (ADR-0003)
; UserEvent에 Linkedid를 직접 실으면 채널 스냅샷 헤더와 중복돼 파싱이 깨진다 — 싣지 않는다
exten => 0212345678,1,Answer()
 same => n,UserEvent(CtiCallStarted,Direction: INBOUND)
 same => n,Queue(queue01)
 same => n,Hangup()

; DID 직통 — 내선으로 바로 연결
exten => _1XXX,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
