[general]
static = yes
writeprotect = yes

[from-internal]
; 내선 간 통화 — CTI 추적 대상 아님
exten => _1XXX,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; 에코 테스트
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[from-trunk]
; 대표번호 — 큐 인입
exten => 0212345678,1,Answer()
 same => n,Queue(queue01)
 same => n,Hangup()

; DID 직통 — 내선으로 바로 연결
exten => _1XXX,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
