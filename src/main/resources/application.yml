server:
  port: 3000

# asterisk-java가 미지원 이벤트 필드마다 내는 WARN 억제 (기능 영향 없음)
# com.itsconv.cti.ami를 DEBUG로 올리면 수신한 AMI 이벤트 원문이 전부 찍힌다
logging:
  level:
    org.asteriskjava.manager.util.EventAttributesHelper: ERROR
    com.itsconv.cti.ami: INFO

spring:
  application:
    name: able-cti
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:15432}/able
    username: able
    password: able

# Asterisk AMI (로컬 docker compose의 asterisk 서비스)
asterisk:
  ami:
    host: ${AMI_HOST:127.0.0.1}
    port: 5038
    username: cti
    password: ctisecret

# 클릭투콜 Originate. 개발환경 고객 역할은 내선 1234라 from-internal로 충분하다
cti:
  outbound:
    context: from-internal
    ring-timeout-ms: 15000
